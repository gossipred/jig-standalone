spring.application.name=jig-standalone
app.version=1.1.0

# 不啟動 web server，純桌面應用
spring.main.web-application-type=none
spring.main.banner-mode=off

# H2 file mode：資料存在使用者家目錄下
spring.datasource.url=jdbc:h2:file:${user.home}/.jig-standalone/data/jigdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Taipei

spring.h2.console.enabled=false

# 上傳檔案存放位置
app.upload.jig-files-dir=${user.home}/.jig-standalone/uploads/jigs

logging.level.root=WARN
logging.level.com.jj=INFO
